
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | SmartHire AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar">

        <a class="logo" href="/">
            SmartHire AI
        </a>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/register">Register</a>
        </div>

    </nav>


    <section class="auth-section">

        <div class="auth-card">

            <h1>Welcome Back!</h1>

            <p class="auth-description">
                Login to your SmartHire AI account.
            </p>


            <form method="POST" class="auth-form">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit" class="primary-btn">
                    Login
                </button>

            </form>


            {% if message %}
                <p class="auth-message error-message">
                    {{ message }}
                </p>
            {% endif %}


            <p class="auth-footer">
                Don't have an account?
                <a href="/register">Create Account</a>
            </p>

        </div>

    </section>


    <footer>

        <p>
            AI Powered Resume Screening and Job Recommendation System
        </p>

        <p>MCA Capstone Project</p>

    </footer>

</body>
</html>
