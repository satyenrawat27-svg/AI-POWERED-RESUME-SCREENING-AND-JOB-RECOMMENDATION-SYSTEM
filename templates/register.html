<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SmartHire AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar">
        <a class="logo" href="/">SmartHire AI</a>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/history">Analysis History</a>
        </div>
    </nav>

    <section class="auth-section">

        <div class="auth-card">

            <h1>Create Your Account</h1>

            <p class="auth-description">
                Join SmartHire AI and start your career journey.
            </p>

            <form method="POST" class="auth-form">

                <label for="name">Full Name</label>
                <input type="text"
                       id="name"
                       name="name"
                       placeholder="Enter your full name"
                       required>

                <label for="email">Email Address</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       required>

                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Minimum 8 characters"
                       minlength="8"
                       required>

                <label for="confirm_password">Confirm Password</label>
                <input type="password"
                       id="confirm_password"
                       name="confirm_password"
                       placeholder="Enter password again"
                       minlength="8"
                       required>

                <button type="submit" class="primary-btn">
                    Create Account
                </button>

            </form>

            {% if message %}
                <p class="auth-message">
                    {{ message }}
                </p>
            {% endif %}

            <p class="auth-footer">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </div>

    </section>

    <footer>
        <p>AI Powered Resume Screening and Job Recommendation System</p>
        <p>MCA Capstone Project</p>
    </footer>

</body>
</html>
